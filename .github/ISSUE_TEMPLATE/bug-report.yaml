name: Bug Report
description: File a bug report to help us fix a problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for using RowerTrain and for taking the time to fill out this bug report!
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What platform are you using?
      options:
        - iOS
        - Android
    validations:
      required: true
  # platform version
  - type: input
    id: platform_version
    attributes:
      label: Platform Version
      description: What version of the platform are you using?
      placeholder: e.g., iOS 16.4 or Android 13
    validations:
      required: false
  - type: input
    id: rower
    attributes:
      label: Rower
      description: What model of rower are you using?
      placeholder: e.g., Domyos woodrower, Merach, etc.
    validations:
      required: false
  - type: dropdown
    id: rower-resistance-type
    attributes:
      label: Resistance Type
      description: What resistance mechanism does your rower use?
      options:
        - Magnetic
        - Air
        - Water
        - Hydraulic
        - Other / Unknown
    validations:
      required: false

  - type: dropdown
    id: rower-resistance-control
    attributes:
      label: Resistance Control
      description: Does your rower support electronic/app-controlled resistance?
      options:
        - "Yes"
        - "No"
        - Not applicable (Manual/Water/Air knob)
    validations:
      required: false
  - type: input
    id: rower-resistance-range
    attributes:
      label: Resistance Range
      description: If resistance control is supported, what is the range?
      placeholder: e.g., 1–16 levels, 1–32 levels, etc.
    validations:
      required: false
  - type: checkboxes
    id: rower-measurements
    attributes:
      label: Available Measurements
      description: Select all measurements and metrics your rower natively provides.
      options:
        - label: Pace / Split (e.g., /500m)
        - label: Distance
        - label: Stroke Rate (SPM)
        - label: Power (Watts)
        - label: Heart Rate
    validations:
      required: false
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A short summary of what the bug is.
      placeholder: e.g., The distance is not shown when rowing on the app
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. Scroll down to '...'
        4. Observe the issue
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: e.g., The distance should be displayed correctly while rowing
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: e.g., The distance is not displayed while rowing
    validations:
      required: true
  - type: upload
    id: screenshot
    attributes:
      label: Screenshot
      description: Attach a screenshot of the issue if applicable.
    validations:
      required: false