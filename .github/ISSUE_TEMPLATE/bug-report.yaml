name: Bug Report
description: File a bug report to help us fix a problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for using RowerTrain and for taking the time to fill out this bug report!
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A short summary of what the bug is.
      placeholder: e.g., The distance is not shown when rowing on the app
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. Scroll down to '...'
        4. Observe the issue
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What platform are you using?
      options:
        - iOS
        - Android
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: e.g., The distance should be displayed correctly while rowing
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: e.g., The distance is not displayed while rowing
    validations:
      required: true
  - type: upload
    id: screenshot
    attributes:
      label: Screenshot
      description: Attach a screenshot of the issue if applicable.
    validations:
      required: false